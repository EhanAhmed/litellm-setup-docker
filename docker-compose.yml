services:
  # --- Lightweight Postgres Database ---
  postgres:
    image: postgres:16-alpine
    container_name: litellm-db
    environment:
      POSTGRES_DB: litellm
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: ${LITELLM_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  # --- Presidio PII/PCI Detection Engine ---
  presidio-analyzer:
    image: mcr.microsoft.com/presidio-analyzer:latest
    container_name: presidio-analyzer
    ports:
      - "5002:3000"
    restart: unless-stopped

  # --- Presidio Anonymization Engine ---
  presidio-anonymizer:
    image: mcr.microsoft.com/presidio-anonymizer:latest
    container_name: presidio-anonymizer
    ports:
      - "5001:3000"
    restart: unless-stopped

  # --- LiteLLM Proxy Server ---
  litellm-proxy:
    # image: ghcr.io/berriai/litellm:main-latest
    build: .
    container_name: litellm-proxy
    ports:
      - "4000:4000"
    volumes:
      - ./config.yaml:/app/config.yaml
      - ./model_prices.json:/app/model_prices.json
      - ${CODE_REPO_PATH}:/app/code:ro
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
      # This connects LiteLLM to our postgres container:
      - DATABASE_URL=postgresql://litellm:${LITELLM_DB_PASSWORD}@postgres:5432/litellm
      - STORE_MODEL_IN_DB=True
      # Presidio endpoints (internal docker service names)
      - PRESIDIO_ANALYZER_API_BASE=http://presidio-analyzer:3000
      - PRESIDIO_ANONYMIZER_API_BASE=http://presidio-anonymizer:3000
      - PROXY_BASE_URL=http://localhost:4000
    command: ["--config", "/app/config.yaml"]
    depends_on:
      - postgres # <--- Ensures Postgres starts before LiteLLM
      - presidio-analyzer
      - presidio-anonymizer
    restart: unless-stopped

volumes:
  pgdata: # <--- Keeps your budget history safe even if container restarts
  
